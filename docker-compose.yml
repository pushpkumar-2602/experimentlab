services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
      POSTGRES_DB: experimentlab
    volumes:
      # Keeps the data even if the container is deleted and recreated.
      - pgdata:/var/lib/postgresql/data
      # Files in this folder run automatically the first time the database
      # is created, so our tables appear without any manual psql step.
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d experimentlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      # "db" is the service name above, which is its address on the private network.
      DATABASE_URL: postgresql+psycopg2://experiment:experiment@db:5432/experimentlab
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      # The API's service name, which is its address on the private network.
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
